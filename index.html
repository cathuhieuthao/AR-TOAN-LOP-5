<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<title>AR TOÁN LỚP 5</title>

</head>

<body>

<h1>HÌNH HỘP CHỮ NHẬT - HÌNH LẬP PHƯƠNG</h1>
